name: Release

# Publish only on a version tag. Pushes to main run CI (lint/tests) but never
# publish, so the registry carries real releases only — no intermediate versions.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # Releases authenticate by trusted publishing: instead of a stored npm token,
  # the job exchanges a short-lived OIDC token that GitHub mints per run. npm
  # accepts it only from the repo and workflow file registered as each package's
  # trusted publisher, so a leaked credential is not a thing that can exist here.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1, both of
          # which Node 24 ships. `pnpm publish` shells out to that npm binary to
          # do the upload, so it inherits OIDC support without implementing it.
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache on a release build. What ships to the registry
          # should come from a clean resolve rather than restored state, so the
          # tarball depends on the lockfile alone.
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Verify before publishing. A published npm version is permanent — it can
      # never be replaced — and nothing stops a tag from being cut off a commit
      # that CI never ran on, so re-check here instead of assuming it passed.
      # As in CI, call the per-package scripts: the root check-types/test scripts
      # each build first, which would redo the build above.
      #
      # Lint is intentionally left to CI. It's a style gate, and a formatting nit
      # can't make a published tarball wrong — it would only add a way for a
      # release to fail for a reason no user would ever observe.
      - run: pnpm -r run check-types
      - run: pnpm -r run test

      # A version tag (vX.Y.Z) publishes the committed version as-is to `latest`,
      # the version a plain `npm install` gets. To release: bump the packages'
      # version, commit, and push the matching tag.
      #
      # No token and no --provenance flag: trusted publishing supplies the
      # credential and generates the signed provenance attestation on its own,
      # binding each tarball to this repo, commit, and workflow run so anyone can
      # verify what the published code was built from:
      # https://docs.npmjs.com/trusted-publishers
      - name: Publish to `latest`
        run: pnpm -r publish --tag latest --no-git-checks
