# The x402 payment as the facilitator — the service that verifies and settles
# it — witnesses it. It shares the seller's verify/settle vocabulary, so every
# witness names `role: facilitator`; only the role says who did the verifying.
#
# No request stage and no `x402.payment.canceled` exception: a facilitator has
# neither hook. A decline is `x402.verify.failed` with the reason in
# `error.message`, where a seller's carries `verify.invalid_reason`.
template: x402-facilitator
version: 1
stages:
  - id: verification
    required: true
    match:
      - event: x402.verify.ok
        role: facilitator
    missing_explanation: "the facilitator did not verify the payment"
  - id: settlement
    required: true
    match:
      - event: x402.settle.ok
        role: facilitator
    missing_explanation: "the facilitator did not settle the payment"
exceptions:
  - x402.verify.failed
  - x402.settle.failed
