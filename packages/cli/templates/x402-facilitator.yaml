# The x402 payment as the facilitator — the service that actually verifies and
# settles it — witnesses it. Every event here is one the trace-x402 adapter
# records with `role: facilitator`, which is what separates this from the
# seller's receipt: the two share the verify/settle vocabulary exactly, and only
# the role says who did the verifying.
#
# There is no request stage (a facilitator has no request gate) and no
# `x402.payment.canceled` exception (it has no cancellation hook — that is the
# very method that tells a resource server apart from a facilitator).
#
# One asymmetry worth knowing when reading a receipt: the SDK delivers a
# facilitator's clean "not valid" to its failure hook rather than its result
# hook, so a decline arrives as `x402.verify.failed` carrying the reason in
# `error.message`, where a seller's carries `verify.invalid_reason`.
template: x402-facilitator
version: 1
stages:
  - id: verification
    required: true
    match:
      - event: x402.verify.ok
        role: facilitator
    missing_explanation: "the facilitator did not verify the payment"
  - id: settlement
    required: true
    match:
      - event: x402.settle.ok
        role: facilitator
    missing_explanation: "the payment verified, but the facilitator did not settle it"
exceptions:
  - x402.verify.failed
  - x402.settle.failed
