# The escrow operation on Arc, observed by two independent witnesses: Circle
# webhooks (the money half — the trace-circle adapter's `circle.*` events) and
# the escrow service's own backend (the obligation half — `escrow.*` events).
# Money stages are witnessed by CONTRACT events because they carry semantics a
# wallet transaction cannot: a deposit call and a release call are both
# outbound contract executions from the wallet's point of view. `chain.*`
# names are reserved for a future chain-query adapter, which will join these
# match-sets as the stronger on-chain witness.
#
# FULL here means RESOLVED, not succeeded. An escrow has two legitimate
# closings — released to the provider, or refunded to the client when the deal
# is called off — and both leave no money in limbo. The template expresses
# this by requiring only the stages common to both paths (agreement, deposit,
# disposition); delivery and criteria are optional, because a refunded escrow
# never reaches them and must not read as incomplete for it. The receipt still
# shows which closing happened: the disposition stage carries its witness
# (Withdrawal or Refund). The accepted cost is that a release with no observed
# evaluation also assembles as FULL — chosen deliberately over teaching the
# template language conditional stages.
#
# Two stages of version 1 are gone rather than optional: `terms_accepted` (no
# act of acceptance exists to witness — the depositor funding the escrow is
# the closest thing to consent) and `record` (no ledger integration observes
# reconciliation). A stage no source can ever close is a permanent blank on
# every receipt; emitting the events anyway would be a manufactured witness.
# If either capability is built, its stage returns here first.
#
# missing_explanation texts state ONLY what was not observed and what that
# absence means. They never assert that another stage happened: explanations
# render on any incomplete receipt, including paths where earlier stages are
# absent too, and "funds are locked but…" on an operation whose deposit never
# happened would be the receipt inventing a fact.
template: escrow-arc
version: 2
stages:
  - id: agreement
    required: true
    match:
      - event: escrow.agreement.created
    missing_explanation: "no escrow agreement was observed — nothing binds the parties to a deliverable or amount"
  - id: deposit                                    # money IN — the lock
    required: true
    match:
      # The contract's own PaymentCreated is the only unambiguous witness: an
      # outbound wallet transaction toward the contract could equally be a
      # deposit call or a release call (both are contract executions), so
      # circle.transaction.outbound.* is kept as evidence, not as a witness.
      - event: circle.contract.payment_created
    missing_explanation: "no deposit was observed — no funds were ever locked in the escrow contract"
  - id: delivery                                   # optional: a refunded escrow never reaches it
    required: false
    match:
      - event: escrow.work.delivered
    missing_explanation: "no deliverable submission was observed — nothing evidences the work was handed over"
  - id: criteria                                   # optional: the evaluation that grants (or denies) release authority
    required: false
    match:
      - event: escrow.criteria.evaluated           # deterministic rule engine; payload.result in {pass, fail}
      - event: escrow.criteria.assessed            # non-deterministic / LLM judgment; closes the stage but carries no deterministic authority
    missing_explanation: "no evaluation against the acceptance criteria was observed — release authority cannot be established"
  - id: review                                     # conditional — present only when criteria are uncertain or disputed
    required: false
    match:
      - event: escrow.review.approved
      - event: escrow.review.rejected
    missing_explanation: "no human review decision was observed — neither an approval nor a rejection was recorded"
  - id: disposition                                # money OUT — release OR refund closes it
    required: true
    match:
      - event: circle.contract.withdrawal          # released to the provider
      - event: circle.contract.refund              # returned to the client
      - event: circle.transaction.inbound.complete # the funds arriving from the contract at a wallet
    missing_explanation: "neither a release nor a refund was observed — nothing shows the escrowed funds were settled either way"
# Faults that mark the operation attention-worthy instead of closing a stage.
# On-chain reverts belong to the future chain-query adapter's vocabulary; a
# dispute event has no observable source in the v1 stack and is deliberately
# not listed — an exception no adapter can emit would be a dead line that
# overpromises coverage.
exceptions:
  - circle.transaction.outbound.failed   # a funding attempt failed
  - circle.transaction.inbound.failed    # a payout transaction failed
  - escrow.criteria.evaluation_failed    # the evaluator errored (NOT a clean result=fail)
